[project]
name = "lawlens"
version = "0.1.0"
description = "국가법령정보 Open API 기반 법률 검색 RAG 및 Agent"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pymilvus>=3.0.2,<3.1",
    "sqlalchemy>=2.1.8",
    "tenacity>=9.2.1",
    "typer>=0.29.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
ml = [
    "flagembedding>=1.4.2",
    "kiwipiepy>=0.24.1",
    "torch>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lawlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # 줄 길이는 formatter 에 맡김 (한글 주석·문자열 예외)

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
